# The website's two sites as static files: the docs (Docusaurus) on 3100 and
# the landing page (Astro) on 3200. Both are built ahead (yarn build); nothing
# runs but nginx, which answers whatever host the proxy in front routes to it.

server_tokens off;
# Redirects stay relative: the proxy in front, not this port, is what the
# browser sees.
absolute_redirect off;

gzip on;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml application/xml text/xml;

server {
    listen 3100;
    root /usr/share/nginx/docs;
    error_page 404 /404.html;

    # Docusaurus names its bundles by their content: they never change.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    location / {
        # A page is a file, a .html or a directory's index - never a listing, and
        # never a redirect to add a slash.
        try_files $uri $uri.html $uri/index.html =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy strict-origin-when-cross-origin;
    }
}

server {
    listen 3200;
    root /usr/share/nginx/landing;

    # Astro names its bundles by their content: they never change.
    location /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    location / {
        # A page is a file, a .html or a directory's index - never a listing, and
        # never a redirect to add a slash.
        try_files $uri $uri.html $uri/index.html =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy strict-origin-when-cross-origin;
    }
}
